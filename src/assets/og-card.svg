  <!-- Masthead kicker -->
  <rect x="90" y="68" width="80" height="18" rx="2" fill="#111111"/>
  <text x="98" y="82" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#FDFDFB" letter-spacing="1.5">RÉSUMÉ</text>

  <text x="180" y="82" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#8A8A8A" letter-spacing="1.2">CURRICULUM VITAE · 2026</text>

  <!-- Name -->
  <text x="90" y="160" font-family="'Newsreader', Georgia, serif" font-size="62" font-weight="700" fill="#111111" letter-spacing="-1.5">Drew Baker</text>

  <!-- Role Title -->
  <text x="92" y="200" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" fill="#595959" letter-spacing="1.2">SENIOR SOFTWARE ENGINEER</text>
  <text x="92" y="225" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="600" fill="#595959" letter-spacing="1.2">FRONTEND LEAD · AI ENABLEMENT</text>

