  <text x="793" y="156" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#111111">Python</text>

  <rect x="875" y="140" width="70" height="24" rx="3" fill="transparent" stroke="#111111" stroke-width="1.5"/>
  <text x="888" y="156" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#111111">Java</text>

  <rect x="955" y="140" width="75" height="24" rx="3" fill="transparent" stroke="#111111" stroke-width="1.5"/>
  <text x="968" y="156" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#111111">RxJS</text>

  <rect x="780" y="175" width="70" height="24" rx="3" fill="transparent" stroke="#111111" stroke-width="1.5"/>
  <text x="793" y="191" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#111111">D3.js</text>

  <rect x="860" y="175" width="80" height="24" rx="3" fill="transparent" stroke="#111111" stroke-width="1.5"/>
  <text x="873" y="191" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#111111">ArcGIS</text>

  <!-- Right side: focus areas -->
  <line x1="780" y1="220" x2="1110" y2="220" stroke="#E5E3DD" stroke-width="1"/>

  <text x="780" y="250" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#111111" letter-spacing="1.5">SPECIALIZATIONS</text>

  <text x="780" y="278" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#595959">■ Enterprise Angular</text>
  <text x="780" y="300" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#595959">■ Data Visualization</text>
  <text x="780" y="322" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#595959">■ Micro-frontends</text>
  <text x="780" y="344" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#595959">■ AI-Enabled Tooling</text>
  <text x="780" y="366" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" fill="#595959">■ Reactive Systems</text>

