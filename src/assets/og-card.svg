<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Newsreader:wght@400;600;700&amp;family=JetBrains+Mono:wght@400;600;700&amp;family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;display=swap');
    </style>
  </defs>

  <!-- Background: crisp ivory paper -->
  <rect width="1200" height="630" fill="#FDFDFB"/>

  <!-- Top accent line -->
