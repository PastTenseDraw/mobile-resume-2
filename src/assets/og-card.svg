    <tspan>"Architecting beautiful user ecosystems,</tspan>
  </text>
  <text x="92" y="314" font-family="'Newsreader', Georgia, serif" font-size="19" font-style="italic" fill="#111111">
    <tspan>micro-frontends, and performance-first systems."</tspan>
  </text>

