  <text x="92" y="452" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#111111" letter-spacing="0.5">⌘  github.com/PastTenseDraw</text>
  <text x="92" y="479" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#111111" letter-spacing="0.5">◉  linkedin.com/in/drew-baker</text>
  <text x="92" y="506" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#111111" letter-spacing="0.5">◎  DFW · Open to Remote / Hybrid</text>

