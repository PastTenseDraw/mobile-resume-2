  <text x="793" y="121" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FDFDFB">Angular</text>

  <rect x="890" y="105" width="110" height="24" rx="3" fill="#111111"/>
  <text x="903" y="121" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#FDFDFB">TypeScript</text>

