  <text x="780" y="420" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#111111" letter-spacing="1.5">6+ YEARS EXPERIENCE</text>
  <text x="780" y="445" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#8A8A8A">Pixel-perfect product design meets</text>
  <text x="780" y="463" font-family="'Plus Jakarta Sans', sans-serif" font-size="12" fill="#8A8A8A">low-latency system architecture</text>

  <!-- Bottom bar -->
  <rect x="0" y="570" width="1200" height="60" fill="#111111"/>
  <text x="90" y="605" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#FDFDFB" letter-spacing="1.5">DREW BAKER</text>
  <text x="330" y="605" font-family="'JetBrains Mono', monospace" font-size="11" fill="#8A8A8A" letter-spacing="0.8">SENIOR SOFTWARE ENGINEER · FRONTEND LEAD · AI ENABLEMENT</text>

  <!-- Colophon ornament -->
  <text x="1120" y="606" font-family="serif" font-size="16" fill="#D90429">❦</text>
