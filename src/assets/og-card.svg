  <rect x="90" y="345" width="300" height="26" rx="13" fill="rgba(217,4,41,0.08)" stroke="rgba(217,4,41,0.35)" stroke-width="1"/>
  <circle cx="106" cy="358" r="4" fill="#D90429"/>
  <text x="118" y="363" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700" fill="#D90429" letter-spacing="1">AVAILABLE FOR SELECT OPPORTUNITIES</text>

